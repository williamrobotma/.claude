# ruff user-global config, synced via ~/.claude; provision.sh lands it where
# ruff looks: an XDG symlink (~/.config/ruff/ruff.toml) on Linux/macOS/WSL, a
# refreshed copy at %APPDATA%/ruff/ruff.toml on Windows. It applies ONLY when a
# project has no own ruff config (any pyproject.toml/ruff.toml overrides it).
#
# Encodes the lint-expressible parts of rules/python.md deterministically:
#   S101: checks the code depends on are a `raise`, never an `assert`
#         (tests excepted via per-file-ignores).
#   W505 + max-doc-length: docstrings/comments wrap at 80.
#   D minus D1xx, google convention: Google-style docstring formatting without
#     requiring a docstring to exist (depth matches the contract).
[lint]
extend-select = ["S101", "W505", "D"]
ignore = ["D1"]

[lint.per-file-ignores]
"**/test_*.py" = ["S101"]
"**/tests/**" = ["S101"]
"**/conftest.py" = ["S101"]

[lint.pycodestyle]
max-doc-length = 80

[lint.pydocstyle]
convention = "google"
