# rumdl user-global config, synced via ~/.claude; provision.sh symlinks
# ~/.config/rumdl/rumdl.toml -> this file.
# MD013 is a 120-col barometer, check-only: its fix hard-wraps, which the
# never-hard-wrap style forbids. Never run --fix without --unfixable MD013.
[global]
respect-gitignore = true

[MD013]
line-length = 120
code-blocks = false
tables = false
reflow = false
